name: CI/CD Pipeline - E-Commerce Platform

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # Stage 1: Static Analysis, Linting & Security Dependency Audit
  # ====================================================================
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Analysis
        run: npm run lint

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

  # ====================================================================
  # Stage 2: Unit & Integration Tests with PostgreSQL Service Container
  # ====================================================================
  test:
    name: Automated Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_secure
          POSTGRES_DB: ecommerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite with In-Memory / PostgreSQL Validation
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password_secure
          DB_NAME: ecommerce_test_db
        run: npm run test:coverage

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

  # ====================================================================
  # Stage 3: Container Image Build, Vulnerability Scan & Version Tagging
  # ====================================================================
  build-and-scan:
    name: Container Build & Security Scan
    needs: [ lint-and-audit, test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate Semantic Version Tag
        id: meta
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "image_tag=ecommerce-api:$VERSION" >> $GITHUB_OUTPUT
          echo "Build Version: $VERSION (SHA: $SHORT_SHA)"

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            ecommerce-api:${{ steps.meta.outputs.version }}
            ecommerce-api:${{ steps.meta.outputs.short_sha }}
            ecommerce-api:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-api:${{ steps.meta.outputs.version }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Inspect Image & Verify Non-Root User
        run: |
          docker inspect ecommerce-api:${{ steps.meta.outputs.version }} | grep -i '"User": "node"' || (echo "FAILED: Image does not run as non-root user 'node'" && exit 1)
          echo "Successfully validated non-root execution policy."

  # ====================================================================
  # Stage 4: Orchestration Verification & Deployment Pre-Flight Check
  # ====================================================================
  deploy-validation:
    name: Deployment Configuration Validation
    needs: [ build-and-scan ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        env:
          IMAGE_TAG: 1.0.${{ github.run_number }}
          DB_PASSWORD: ci_sample_secret_do_not_use_in_prod
        run: |
          docker compose config --quiet
          echo "Docker Compose file syntax is valid and verified."

      - name: Log Deployment & Rollback Manifest
        run: |
          echo "=========================================="
          echo "Deployment Pre-flight Check Succeeded"
          echo "Target Image: ecommerce-api:1.0.${{ github.run_number }}"
          echo "Commit: ${{ github.sha }}"
          echo "Rollback Target: previous stable release"
          echo "=========================================="
