services:
  # ====================================================================
  # Database Tier: PostgreSQL 16
  # ====================================================================
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - ecommerce-backend
    ports:
      - "${DB_PORT_BIND:-127.0.0.1:5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ====================================================================
  # Application Tier: E-Commerce API Service
  # ====================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:${IMAGE_TAG:-latest}
    container_name: ecommerce-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-algions-admin-secret-key-2026}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: "true"
      AUTO_MIGRATE: "true"
    networks:
      - ecommerce-backend
      - ecommerce-frontend
    ports:
      - "${API_PORT_BIND:-127.0.0.1:3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  # ====================================================================
  # Edge Tier: Nginx Reverse Proxy with TLS/HTTPS Termination
  # ====================================================================
  proxy:
    image: nginx:1.27-alpine
    container_name: ecommerce-proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - ecommerce-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# ====================================================================
# Persistent Data Volumes & Isolated Networks
# ====================================================================
volumes:
  db_data:
    name: ecommerce_db_data

networks:
  ecommerce-backend:
    driver: bridge
    internal: false
  ecommerce-frontend:
    driver: bridge
