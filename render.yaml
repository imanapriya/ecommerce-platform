# ====================================================================
# Render Blueprint (Infrastructure-as-Code)
# Deploys E-Commerce API Service + Managed PostgreSQL 16 on Render Free Tier
# ====================================================================
services:
  - type: web
    name: ecommerce-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ADMIN_API_KEY
        value: algions-admin-secret-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-postgres
          property: connectionString

databases:
  - name: ecommerce-postgres
    plan: free
    region: oregon
    databaseName: ecommerce_db
    user: postgres
